<!DOCTYPE html>
<html>
  <head>
    <title>Light/Dark Mode</title>
    <style>
      :root {
        --background-color: #ffffff;
        --text-color: #333333;
      }

      [data-theme="dark"] {
        --background-color: #333333;
        --text-color: #ffffff;
      }

      body {
        background-color: var(--background-color);
        color: var(--text-color);
        transition: all 0.5s ease;
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .theme-switch {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background-color: var(--text-color);
        color: var(--background-color);
        z-index: 1000;
        transition: all 0.5s ease;
      }

      .content {
        max-width: 800px;
        margin: 60px auto;
        padding: 20px;
        transition: all 0.5s ease;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        flex: 1;
      }

      h1 {
        transition: all 0.5s ease;
        margin-bottom: 20px;
      }

      p {
        transition: all 0.5s ease;
        line-height: 1.6;
        max-width: 600px;
      }

      [data-theme="dark"] .content {
        text-align: center;
      }

      [data-theme="dark"] h1 {
        font-size: 2.5em;
      }

      [data-theme="dark"] p {
        font-size: 1.2em;
      }
    </style>
    <script>
      // Function to set cookie
      function setCookie(name, value, days) {
        let expires = "";
        if (days) {
          const date = new Date();
          date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
          expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/";
      }

      // Function to get cookie
      function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(";");
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) === " ") c = c.substring(1, c.length);
          if (c.indexOf(nameEQ) === 0)
            return c.substring(nameEQ.length, c.length);
        }
        return null;
      }

      // Function to toggle theme
      function toggleTheme() {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";

        document.documentElement.setAttribute("data-theme", newTheme);
        setCookie("theme", newTheme, 365); // Store preference for 1 year
      }

      // Check for saved theme preference on page load
      document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = getCookie("theme");
        if (savedTheme) {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      });
    </script>
  </head>
  <body>
    <button class="theme-switch" onclick="toggleTheme()">Toggle Theme</button>
    <div class="content">
      <h1>Light/Dark Mode Example</h1>
      <p>
        This page demonstrates a light/dark mode toggle that persists your
        preference using cookies.
      </p>
    </div>
  </body>
</html>
