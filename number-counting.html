<!DOCTYPE html>
<html>
  <head>
    <title>Number counting</title>
    <style>
      .container {
        text-align: center;
        margin-top: 50px;
        font-family: Arial, sans-serif;
      }
      .counter {
        font-size: 48px;
        font-weight: bold;
        margin: 20px 0;
        color: #333;
      }
      .controls {
        margin: 20px 0;
        padding: 20px;
        background: #f5f5f5;
        border-radius: 8px;
        display: inline-block;
      }
      .input-group {
        margin: 10px 0;
      }
      label {
        margin-right: 10px;
      }
      input {
        padding: 5px;
        margin: 0 10px;
        width: 100px;
      }
      button {
        padding: 10px 20px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background: #45a049;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="counter" id="counter">0</div>

      <div class="controls">
        <div class="input-group">
          <label>Start Number:</label>
          <input type="number" id="startNumber" value="0" min="0" />
        </div>
        <div class="input-group">
          <label>End Number:</label>
          <input type="number" id="endNumber" value="1000" min="0" />
        </div>
        <div class="input-group">
          <label>Duration (seconds):</label>
          <input type="number" id="duration" value="3" min="1" max="10" />
        </div>
        <button onclick="startCounter()">Start Counting</button>
      </div>
    </div>

    <script>
      let currentAnimation = null;

      function startCounter() {
        // Clear any existing animation
        if (currentAnimation) {
          clearInterval(currentAnimation);
        }

        const counterElement = document.getElementById("counter");
        const startNumber =
          parseInt(document.getElementById("startNumber").value) || 0;
        const endNumber =
          parseInt(document.getElementById("endNumber").value) || 1000;
        const duration =
          (parseInt(document.getElementById("duration").value) || 3) * 1000; // Convert to milliseconds

        const frameDuration = 1000 / 60; // 60fps
        const totalFrames = Math.round(duration / frameDuration);
        let frame = 0;

        // Set initial value
        counterElement.textContent = startNumber;

        currentAnimation = setInterval(() => {
          frame++;
          const progress = frame / totalFrames;
          const currentNumber = Math.floor(
            startNumber + progress * (endNumber - startNumber)
          );

          counterElement.textContent = currentNumber;

          if (frame === totalFrames) {
            clearInterval(currentAnimation);
            currentAnimation = null;
          }
        }, frameDuration);
      }

      // Start the animation when the page loads
      window.onload = startCounter;
    </script>
  </body>
</html>
