<html>
  <head>
    <title>Cookie</title>
    <style>
      .cookie-box {
        background-color: #f0f0f0;
        padding: 10px;
        border-radius: 5px;
      }
      .cookie-box-content {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .cookie-box-buttons {
        display: flex;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Cookie</h1>
    <div class="cookie-box">
      <div class="cookie-box-content">
        <h2>Cookie</h2>
        <p>
          We use cookies to ensure you get the best experience on our website.
        </p>
      </div>
      <div class="cookie-box-buttons">
        <button class="cookie-box-button-accept">Accept</button>
        <button class="cookie-box-button-decline">Decline</button>
      </div>
    </div>
    <script>
      const cookieBox = document.querySelector(".cookie-box");
      const cookieBoxButtons = document.querySelector(".cookie-box-buttons");
      const cookieBoxContent = document.querySelector(".cookie-box-content");
      const cookieBoxButtonAccept = document.querySelector(
        ".cookie-box-button-accept"
      );
      const cookieBoxButtonDecline = document.querySelector(
        ".cookie-box-button-decline"
      );

      // Function to set cookie
      function setCookie(name, value, days) {
        let expires = "";
        if (days) {
          const date = new Date();
          date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
          expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + value + expires + "; path=/";
      }

      // Function to get cookie
      function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(";");
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) === " ") c = c.substring(1, c.length);
          if (c.indexOf(nameEQ) === 0)
            return c.substring(nameEQ.length, c.length);
        }
        return null;
      }

      // Check if cookie exists
      if (getCookie("cookieConsent")) {
        cookieBox.style.display = "none";
      }

      cookieBoxButtonAccept.addEventListener("click", () => {
        setCookie("cookieConsent", "accepted", 365); // Cookie lasts for 1 year
        cookieBox.style.display = "none";
      });

      cookieBoxButtonDecline.addEventListener("click", () => {
        setCookie("cookieConsent", "declined", 365); // Cookie lasts for 1 year
        cookieBox.style.display = "none";
      });
    </script>
  </body>
</html>
