<html>
  <head>
    <title>Auto video</title>
    <style>
      .video-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .video-controls {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        z-index: 1000;
      }
      .control-btn {
        background: rgba(0, 0, 0, 0.5);
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 20px;
      }
      .control-btn:hover {
        background: rgba(0, 0, 0, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="video-container">
      <video
        id="video"
        autoplay
        loop=""
        style="width: 100%; height: 100%"
        muted=""
        playsinline=""
        data-wf-ignore="true"
        data-object-fit="cover"
      >
        <source
          src="https://cdn.prod.website-files.com/67b418349cd29a4f7829b4a5%2F68024e145ecf3c7f915cb7fd_gr_corporate%20%28540p%29-transcode.mp4"
          data-wf-ignore="true"
        />
        <source
          src="https://cdn.prod.website-files.com/67b418349cd29a4f7829b4a5%2F68024e145ecf3c7f915cb7fd_gr_corporate%20%28540p%29-transcode.webm"
          data-wf-ignore="true"
        />
      </video>
      <div class="video-controls">
        <button class="control-btn" id="playPauseBtn">⏸</button>
        <button class="control-btn" id="muteBtn">🔇</button>
      </div>
    </div>

    <script>
      const video = document.getElementById("video");
      const playPauseBtn = document.getElementById("playPauseBtn");
      const muteBtn = document.getElementById("muteBtn");

      // Function to update play/pause button icon
      function updatePlayPauseIcon() {
        playPauseBtn.textContent = video.paused ? "▶" : "⏸";
      }

      // Function to update mute button icon
      function updateMuteIcon() {
        muteBtn.textContent = video.muted ? "🔇" : "🔊";
      }

      // Initial icon states
      updatePlayPauseIcon();
      updateMuteIcon();

      // Play/Pause button click handler
      playPauseBtn.addEventListener("click", () => {
        if (video.paused) {
          video.play();
        } else {
          video.pause();
        }
        updatePlayPauseIcon();
      });

      // Mute button click handler
      muteBtn.addEventListener("click", () => {
        video.muted = !video.muted;
        updateMuteIcon();
      });

      // Listen for video state changes
      video.addEventListener("play", updatePlayPauseIcon);
      video.addEventListener("pause", updatePlayPauseIcon);
      video.addEventListener("volumechange", updateMuteIcon);
    </script>
  </body>
</html>
