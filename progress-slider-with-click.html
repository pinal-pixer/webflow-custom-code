<html>
  <head>
    <title>Progress Slider with Click</title>
    <style>
      /* Basic Reset and Body Styling */
      body {
        margin: 0;
        font-family: sans-serif; /* Or your preferred font */
      }

      /* Layout and Section Styling */
      .vision_payload-section {
        position: relative;
        overflow: hidden;
      }

      .background-color-primary {
        background-color: #1a1a2e; /* Example dark background color */
      }

      .padding-global {
        padding-left: 24px;
        padding-right: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .container-medium {
        max-width: 960px; /* Example container width */
        margin-left: auto;
        margin-right: auto;
      }

      .text-color-alternate {
        color: #ffffff; /* Example light text color */
      }

      .header_top-block {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .hide_desktop {
        display: none; /* Hide on desktop by default */
      }

      .button {
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        padding: 12px 24px; /* Example padding */
        background-color: #007bff; /* Example button color */
        color: white;
        text-decoration: none;
        border-radius: 4px; /* Example border radius */
      }

      .button_inner {
        display: flex;
        align-items: center;
      }

      .button_arrow {
        width: 20px; /* Example arrow size */
        height: 20px;
        margin-left: 8px; /* Example spacing */
      }

      .button .absolute {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Payload Block Styling */
      .payload_block {
        display: flex;
        flex-wrap: wrap;
        gap: 48px; /* Example gap */
      }

      .payload_image-block {
        width: 100%;
        max-width: 81rem;
        padding-top: 64%;
        position: relative;
      }

      .payload_image {
        background-color: #1a1a2e;
        transition: all 0.3s;
        position: absolute;
        inset: 0%;
      }
      .payload_image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        vertical-align: middle;
      }

      /* Modular Payload Styling */
      .modular_payload {
        justify-content: space-between;
        align-items: center;
        display: flex;
        position: absolute;
        inset: 0% 0% auto;
        max-width: 1200px;
        margin: 0 auto;
      }

      .payload_left {
        grid-column-gap: 0.5rem;
        grid-row-gap: 0.5rem;
        flex-flow: column;
        display: flex;
      }

      .modular_payload-name {
        font-size: 20px;
        line-height: 1.75rem;
        height: 1.75rem;
        position: relative;
      }

      .modular_payload-text {
        background-color: #1a1a2e;
        font-size: 18px;
        line-height: 1.75rem;
        transition: all 0.3s;
        position: absolute;
        inset: 0%;
      }

      .modular_payload-text.active {
        z-index: 1;
      }

      .payload_line {
        background-color: #333;
        width: 11.125rem;
        height: 0.125rem;
        position: relative;
      }

      .payload_active {
        background-color: #007bff;
        width: 0%;
        height: 0.125rem;
        transition: all 0.3s;
        position: absolute;
        inset: 0% auto 0% 0%;
      }

      /* Navigation Arrows */
      .payload_right {
        display: flex;
        align-items: center;
        gap: 16px; /* Example spacing */
      }

      .payload_prev-arrow,
      .payload_next-arrow {
        cursor: pointer;
        width: 40px; /* Increased size based on image */
        height: 40px; /* Increased size based on image */
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.6); /* Softer border color */
        border-radius: 4px; /* Square shape based on image */
        transition: opacity 0.3s ease-in-out;
        color: rgba(255, 255, 255, 0.6); /* Softer icon color */
      }

      .payload_prev-arrow:hover,
      .payload_next-arrow:hover {
        border-color: #ffffff; /* White border on hover */
        color: #ffffff; /* White icon color on hover */
      }

      .payload_prev-arrow.disabled,
      .payload_next-arrow.disabled {
        opacity: 0.3; /* Reduced opacity for disabled */
        cursor: not-allowed;
      }

      .flex_icon svg {
        width: 24px; /* Adjust SVG size if needed */
        height: 24px;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .header_top-block {
          flex-direction: column;
          align-items: flex-start;
        }

        .hide_desktop {
          display: flex; /* Show on mobile */
        }
      }
    </style>
  </head>

    <script>
      //modular payloads
      document.addEventListener("DOMContentLoaded", function () {
        const images = document.querySelectorAll(".payload_image");
        const titles = document.querySelectorAll(".modular_payload-text");
        const activeLine = document.querySelector(".payload_active");
        const nextButton = document.querySelector(".payload_next-arrow");
        const prevButton = document.querySelector(".payload_prev-arrow");

        let currentIndex = 0;
        const totalSlides = titles.length;
        let autoSlideInterval;

        // Reset progress bar to 0% and animate to 100%
        function animateProgressBar() {
          if (!activeLine) return;

          // Reset to 0% instantly (no animation)
          activeLine.style.transition = "none";
          activeLine.style.width = "0%";

          // Force reflow to apply the reset
          void activeLine.offsetWidth;

          // Animate to 100% with smooth transition
          activeLine.style.transition = "width 3s linear"; // Match duration to auto-slide
          activeLine.style.width = "100%";
        }

        function updateSlider(index) {
          currentIndex = index;

          // Update Images
          images.forEach((img, idx) => {
            img.style.opacity = idx === index ? "1" : "0";
          });

          // Update Titles
          titles.forEach((title, idx) => {
            title.classList.toggle("active", idx === index);
            title.style.zIndex = idx === index ? "2" : "0";
          });

          // Start progress bar animation
          animateProgressBar();

          // Update arrow states
          if (prevButton) prevButton.classList.toggle("disabled", index === 0);
          if (nextButton)
            nextButton.classList.toggle("disabled", index === totalSlides - 1);
        }

        function nextSlide() {
          const nextIndex = (currentIndex + 1) % totalSlides;
          updateSlider(nextIndex);
        }

        function prevSlide() {
          const prevIndex = (currentIndex - 1 + totalSlides) % totalSlides;
          updateSlider(prevIndex);
        }

        // Auto-slide functionality
        function startAutoSlide() {
          autoSlideInterval = setInterval(nextSlide, 3000); // 3s per slide
        }

        function resetAutoSlide() {
          clearInterval(autoSlideInterval);
          startAutoSlide();
        }

        // Event listeners
        if (nextButton)
          nextButton.addEventListener("click", () => {
            nextSlide();
            resetAutoSlide();
          });

        if (prevButton)
          prevButton.addEventListener("click", () => {
            prevSlide();
            resetAutoSlide();
          });

        titles.forEach((title, idx) => {
          title.addEventListener("click", () => {
            updateSlider(idx);
            resetAutoSlide();
          });
        });

        // Initialize
        updateSlider(0);
        startAutoSlide();
      });
    </script>
  </body>
</html>
